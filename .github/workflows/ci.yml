name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity warning --check-sourced \
            scripts/install.sh \
            scripts/uninstall.sh \
            scripts/notify-play.sh

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }
          Import-Module PSScriptAnalyzer
          $results = Invoke-ScriptAnalyzer -Path scripts -Severity Warning -Recurse -Settings PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found issues"
            exit 1
          }

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # --- PSScriptAnalyzer on all platforms (D-06) ---
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }
          Import-Module PSScriptAnalyzer
          $results = Invoke-ScriptAnalyzer -Path scripts -Severity Warning -Recurse -Settings PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found issues"
            exit 1
          }

      # --- bats tests (Linux + macOS only) ---
      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Run bats tests
        if: runner.os != 'Windows'
        uses: bats-core/bats-action@v3.0.1
        with:
          bats-version: "1.11.0"
          path: tests/bash

      # --- Pester tests (all platforms) ---
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.6.1 -Force -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.6.1

      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester -Path tests/powershell -Output Detailed
